name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Check that the core does not need the RL stack
        run: |
          python -m pip check
          python -c "import importlib.util; assert all(importlib.util.find_spec(p) is None for p in ('torch', 'stable_baselines3', 'optuna'))"
      - name: Run tests
        # Two parametrised cases compare against the experiment runner,
        # which is not released yet; they are deselected until it is.
        run: python -m pytest -q unit_tests -k 'not primary_evaluation and not calibration'
      - name: Run the synthetic friction example
        run: python tools/synthetic_friction_example.py > /dev/null
