algo:
  name: ppo_eiie
  family: ppo
  policy: MlpPolicy
  policy_kwargs:
    features_extractor_class: eiie
    features_extractor_kwargs:
      hidden_dim: 32
  model_kwargs:
    n_steps: 2048
    batch_size: 2048
    n_epochs: 10
    learning_rate: 0.0001
    gamma: 0.99
    ent_coef: 0.005
training:
  total_timesteps: 300000
